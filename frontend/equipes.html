<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipes | ArenaManager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="equipes">
  <header class="topo">
    <div class="topo-interno">
      <span class="marca">ArenaManager</span>
      <nav id="menu" aria-label="Menu principal"></nav>
    </div>
  </header>
  <main>
    <h1>Equipes</h1>
    <p class="sub">Gerencie as equipes de cada campeonato.</p>
    <div id="aviso" class="aviso" role="status" hidden></div>
    <div class="painel">
      <label>Campeonato
        <select id="campeonato"></select>
      </label>
    </div>
    <form id="form-equipe" class="linha-form painel" style="margin-top:1rem">
      <label>Nome da equipe
        <input name="nome" required maxlength="60">
      </label>
      <button type="submit">Salvar equipe</button>
    </form>
    <h2>Equipes do campeonato</h2>
    <div class="rolagem">
      <table>
        <thead><tr><th>Equipe</th><th>Ações</th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
