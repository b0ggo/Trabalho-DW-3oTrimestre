<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classificação | ArenaManager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="classificacao">
  <header class="topo">
    <div class="topo-interno">
      <span class="marca">ArenaManager</span>
      <nav id="menu" aria-label="Menu principal"></nav>
    </div>
  </header>
  <main>
    <h1>Classificação</h1>
    <p class="sub">A tabela é calculada automaticamente a partir dos placares registrados.</p>
    <div id="aviso" class="aviso" role="status" hidden></div>
    <div class="painel">
      <label>Campeonato
        <select id="campeonato"></select>
      </label>
    </div>
    <h2>Tabela</h2>
    <div class="rolagem">
      <table>
        <thead><tr>
          <th class="num">Pos.</th><th>Equipe</th><th class="num" title="Pontos">P</th><th class="num" title="Jogos">J</th>
          <th class="num" title="Vitórias">V</th><th class="num" title="Empates">E</th><th class="num" title="Derrotas">D</th>
          <th class="num" title="Gols marcados">GP</th><th class="num" title="Gols sofridos">GC</th><th class="num" title="Saldo de gols">SG</th>
        </tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
